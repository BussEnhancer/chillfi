name: chillfi
description: "ChillFi - Electronics Shopping App"
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1

  # HTTP & API
  dio: ^5.7.0
  retrofit: ^4.4.1

  # State Management
  provider: ^6.1.2
  shared_preferences: ^2.3.3

  # Auth & Storage
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Navigation
  go_router: ^14.6.2

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Notifications & Auth
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  firebase_auth: ^5.3.0
  flutter_local_notifications: ^18.0.1

  # OTP input
  pinput: ^5.0.0

  # Voice search
  speech_to_text: ^7.0.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  connectivity_plus: ^6.1.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Poppins bundled (SIL OFL 1.1) so text renders offline; google_fonts picks these up by file name.
    - assets/fonts/
