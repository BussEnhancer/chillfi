# ChillFi — nginx site (managed by the deploy notes in QA/OPS_RUNBOOK.md; Certbot lines kept as-is)

# Compression for text assets (HTML, JS, CSS, JSON, SVG, XML) — the main script shrinks ~70%.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript application/json image/svg+xml;

# www.chillfi.in → chillfi.in (one canonical address for customers and search engines)
server {
    server_name www.chillfi.in;
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chillfi.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chillfi.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    return 301 https://chillfi.in$request_uri;
}

server {
    server_name chillfi.in;

    client_max_body_size 20M;

    # API: security headers come from the app (helmet)
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/chillfi;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/chillfi-security-headers.conf;
    }

    location / {
        root /var/www/chillfi;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/chillfi-security-headers.conf;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chillfi.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chillfi.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.chillfi.in) {
        return 301 https://chillfi.in$request_uri;
    } # managed by Certbot

    if ($host = chillfi.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name chillfi.in www.chillfi.in;
    return 404; # managed by Certbot
}
